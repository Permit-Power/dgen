# Re-scan the finished net-billing runs to recover the per-agent detail those
# runs discarded: the yearly bill arrays, and the self-consumption/export split.
#
# 98 tasks, one per state-scenario pair, ordered largest state first.
# Wall clock is set by the slowest single task, not by the total, and California
# has roughly eighty times the agents of DC. Splitting by scenario as well as
# state halves the longest task; ordering big states first stops the job ending
# with one straggler running alone.
#
# Parallelism is 98 because SPOT draws on PREEMPTIBLE_CPUS, which is 5000
# in us-east1: 98 tasks at 32 vCPU is 3136, inside that. Do NOT run this
# with --provisioning-model=STANDARD at this parallelism: on-demand CPUS quota is
# 300 and C2D_CPUS is 500, so it would queue at about 9 tasks at a time.
#
# Submit with:
#   gcloud batch jobs submit "nb-scan-$(date -u +%Y%m%d-%H%M%S)" \
#     --location=us-east1 \
#     --config=batch_job_yamls/dgen-batch-job-netbilling-scan.yaml \
#     --machine-type=c2d-highcpu-32 --provisioning-model=SPOT
logsPolicy:
  destination: CLOUD_LOGGING

taskGroups:
  - taskCount: "98"
    parallelism: "98"
    schedulingPolicy: AS_SOON_AS_POSSIBLE

    taskSpec:
      # Spot instances get preempted; retries are not optional here.
      maxRetryCount: 3
      environment:
        variables:
          DB_USER: "postgres"
          DB_PASS: "postgres"
          DB_NAME: "dgendb"
          INSTANCE_CONNECTION_NAME: "dgen-466702:us-east1:dgen-db"
          USE_PRIVATE_IP_DIRECT: "1"
          DB_PRIVATE_IP: "10.80.160.3"
          PG_CONN_STRING: >
            host=/cloudsql/dgen-466702:us-east1:dgen-db
            port=5432
            dbname=dgendb
            user=postgres
            password=postgres
          LOCAL_CORES: "32"
          # The scan refuses to start unless this agrees with the schema pattern,
          # so a net-billing run cannot be scanned under net-metering rules.
          FORCE_NET_BILLING: "1"
          AGENT_FILE: "agent_df_base_res_national_updated_tariffs_2026.pkl"

      runnables:
      - container:
          imageUri: us-east1-docker.pkg.dev/dgen-466702/dgen-repo-east1/dgen:latest
          entrypoint: bash
          commands:
            - -lc
            - |
              #!/usr/bin/env bash
              set -euo pipefail

              source "$(conda info --base)/etc/profile.d/conda.sh"
              conda activate dg3n

              python /opt/dgen_os/python/fetch_files.py dgen-assets \
                input_agents/${AGENT_FILE} \
                /opt/dgen_os/input_agents/${AGENT_FILE}

              cat > /tmp/pairs.csv <<'PAIRS'
              CA,baseline
              CA,policy
              TX,baseline
              TX,policy
              NY,baseline
              NY,policy
              FL,baseline
              FL,policy
              PA,baseline
              PA,policy
              IL,baseline
              IL,policy
              OH,baseline
              OH,policy
              MI,baseline
              MI,policy
              NC,baseline
              NC,policy
              GA,baseline
              GA,policy
              VA,baseline
              VA,policy
              NJ,baseline
              NJ,policy
              WA,baseline
              WA,policy
              AZ,baseline
              AZ,policy
              MA,baseline
              MA,policy
              TN,baseline
              TN,policy
              IN,baseline
              IN,policy
              MO,baseline
              MO,policy
              MD,baseline
              MD,policy
              WI,baseline
              WI,policy
              CO,baseline
              CO,policy
              MN,baseline
              MN,policy
              SC,baseline
              SC,policy
              AL,baseline
              AL,policy
              LA,baseline
              LA,policy
              KY,baseline
              KY,policy
              OR,baseline
              OR,policy
              OK,baseline
              OK,policy
              CT,baseline
              CT,policy
              IA,baseline
              IA,policy
              MS,baseline
              MS,policy
              AR,baseline
              AR,policy
              KS,baseline
              KS,policy
              UT,baseline
              UT,policy
              NV,baseline
              NV,policy
              NM,baseline
              NM,policy
              NE,baseline
              NE,policy
              WV,baseline
              WV,policy
              ID,baseline
              ID,policy
              NH,baseline
              NH,policy
              ME,baseline
              ME,policy
              RI,baseline
              RI,policy
              MT,baseline
              MT,policy
              DE,baseline
              DE,policy
              SD,baseline
              SD,policy
              ND,baseline
              ND,policy
              VT,baseline
              VT,policy
              WY,baseline
              WY,policy
              DC,baseline
              DC,policy
              PAIRS

              cd /opt/dgen_os/python
              python rerun_scan.py \
                --state-file /tmp/pairs.csv \
                --task-index ${BATCH_TASK_INDEX} \
                --run-name synapse_netbilling \
                --agents /opt/dgen_os/input_agents/${AGENT_FILE} \
                --out /tmp/scan \
                --cores 32 \
                --gcs-bucket dgen-assets \
                --gcs-prefix netbilling_scan

      computeResource:
        cpuMilli: 32000
        memoryMib: 65536
allocationPolicy:
  network:
    networkInterfaces:
      - network: "projects/dgen-466702/global/networks/default"
        subnetwork: "projects/dgen-466702/regions/us-east1/subnetworks/default"
